{% extends "base.html" %}
{% block titre %}Connexion · MariTrust{% endblock %}
{% block contenu %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm mt-4">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Connexion</h1>
        <p class="text-muted small mb-4">Identifiez-vous pour accéder à votre espace.</p>
        {% if form.errors %}<div class="alert alert-danger py-2">Identifiants incorrects.</div>{% endif %}
        <form method="post">{% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Nom d'utilisateur</label>
            <input class="form-control" type="text" name="username" id="id_username" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Mot de passe</label>
            <input class="form-control" type="password" name="password" id="id_password" required>
          </div>
          <button class="btn btn-primary w-100" style="background:var(--marine);border-color:var(--marine)">Se connecter</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
